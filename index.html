<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR FLOW</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #070914;
    color: white;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* MENU */
.sidebar {
    width: 240px;
    background: #0d1020;
    padding: 25px 15px;
    border-right: 1px solid #252941;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 35px;
    text-align: center;
}

.logo span {
    color: #ff8a00;
}

.menu button {
    width: 100%;
    padding: 13px;
    margin: 5px 0;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #c8cad8;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
}

.menu button:hover,
.menu .active {
    background: linear-gradient(90deg,#7b2cff,#ff168f);
    color: white;
}

/* CONTEÚDO */
.main {
    flex: 1;
    padding: 30px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.top h1 {
    font-size: 28px;
}

.user {
    background: #15192c;
    padding: 10px 15px;
    border-radius: 20px;
}

/* CARDS */
.stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.card {
    background: #111528;
    border: 1px solid #242941;
    border-radius: 16px;
    padding: 20px;
}

.card small {
    color: #999fb7;
}

.card h2 {
    margin-top: 8px;
    font-size: 27px;
}

.purple {
    color: #a875ff;
}

.orange {
    color: #ff9d2e;
}

.green {
    color: #29d391;
}

.pink {
    color: #ff4fa3;
}

/* BUSCA */
.search-area {
    background: linear-gradient(135deg,#17112b,#101528);
    border: 1px solid #37305c;
    padding: 25px;
    border-radius: 18px;
    margin-bottom: 30px;
}

.search-area h2 {
    margin-bottom: 8px;
}

.search-area p {
    color: #a8abc0;
    margin-bottom: 18px;
}

.search {
    display: flex;
    gap: 10px;
}

.search input {
    flex: 1;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #353950;
    background: #080b16;
    color: white;
    outline: none;
}

.search button {
    padding: 15px 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg,#7b2cff,#ff168f);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* CATEGORIAS */
.categories {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 15px 0 25px;
}

.categories button {
    border: 1px solid #30354b;
    background: #111528;
    color: #d7d8e2;
    padding: 9px 15px;
    border-radius: 20px;
    cursor: pointer;
}

/* OFERTAS */
.section-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

.section-title span {
    color: #a875ff;
}

.products {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 18px;
}

.product {
    background: #111528;
    border: 1px solid #242941;
    border-radius: 17px;
    padding: 16px;
    transition: .2s;
}

.product:hover {
    transform: translateY(-3px);
    border-color: #7b2cff;
}

.product-img {
    height: 150px;
    background: #080b16;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    margin-bottom: 14px;
}

.product h3 {
    font-size: 17px;
    margin-bottom: 8px;
}

.old {
    color: #777d91;
    text-decoration: line-through;
}

.price {
    font-size: 23px;
    font-weight: bold;
    color: #fff;
    margin: 5px 0;
}

.discount {
    color: #29d391;
    font-size: 13px;
}

.score {
    display: inline-block;
    margin: 10px 0;
    padding: 5px 9px;
    border-radius: 8px;
    background: #1b3c35;
    color: #4ee6ae;
    font-size: 12px;
}

.product button {
    width: 100%;
    padding: 11px;
    border: 0;
    border-radius: 9px;
    background: linear-gradient(90deg,#7b2cff,#ff168f);
    color: white;
    font-weight: bold;
    cursor: pointer;
}
